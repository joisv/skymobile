name: skyrental_admin
description: "SKYRental Admin & Rental Management Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  print_bluetooth_thermal: ^1.2.4
  permission_handler: ^11.3.1
  shared_preferences: ^2.5.5
  barcode_widget: ^2.0.4
  mobile_scanner: ^7.4.2
  image_picker: ^1.2.3
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
